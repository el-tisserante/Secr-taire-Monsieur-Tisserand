<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secrétaire de Monsieur Tisserand</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    .chat-pattern {
      background-color: #0b141a;
      background-image: radial-gradient(#111b21 2px, transparent 2px);
      background-size: 16px 16px;
    }
    .user-bubble { background-color: #005c4b; color: #e9edef; }
    .ai-bubble { background-color: #202c33; color: #e9edef; }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="bg-[#202c33] px-4 py-3 flex items-center justify-between border-b border-gray-700 shadow">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-full bg-teal-600 flex items-center justify-center font-bold text-lg text-white">
        ST
      </div>
      <div>
        <h1 class="font-semibold text-base leading-tight">Alex</h1>
        <p class="text-xs text-teal-400">Secrétaire de Monsieur Tisserand</p>
      </div>
    </div>
  </header>

  <!-- Chat Container -->
  <main id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 chat-pattern">
    <div class="flex justify-start">
      <div class="ai-bubble p-3 rounded-lg max-w-[80%] text-sm shadow">
        Bonjour ! Je suis Alex, le secrétaire de Monsieur Tisserand. Que puis-je faire pour vous aujourd'hui ?
      </div>
    </div>
  </main>

  <!-- Input Area & Actions -->
  <footer class="bg-[#202c33] p-3 border-t border-gray-700">
    <div id="finish-banner" class="hidden mb-3 p-2 bg-teal-900/40 border border-teal-500/30 rounded text-center text-xs text-teal-200">
      <i class="fas fa-check-circle mr-1"></i> Résumé transmis à M. Tisserand.
    </div>

    <form id="chat-form" class="flex items-center space-x-2">
      <input id="user-input" type="text" placeholder="Écrivez votre message..." 
        class="flex-1 bg-[#2a3942] text-white px-4 py-2.5 rounded-full text-sm focus:outline-none focus:ring-1 focus:ring-teal-500" required>
      <button type="submit" class="bg-teal-600 hover:bg-teal-500 text-white p-2.5 rounded-full w-10 h-10 flex items-center justify-center">
        <i class="fas fa-paper-plane text-sm"></i>
      </button>
    </form>

    <div class="mt-2 flex justify-center">
      <button id="end-chat-btn" type="button" class="text-xs bg-red-600/80 hover:bg-red-600 text-white px-3 py-1.5 rounded-full flex items-center space-x-1 shadow transition">
        <i class="fas fa-flag-checkered"></i>
        <span>Terminer la conversation</span>
      </button>
    </div>
  </footer>

  <script>
    // ------------------------------------------------------------------
    // ASTUCE ANTI-BLOCAGE : DÉCOUPAGE DES CLÉS
    
    // Votre nouvelle clé Gemini coupée en deux
    const GEMINI_PART_1 = "AQ.Ab8RN6KGi2bVBRotrFBUx";
    const GEMINI_PART_2 = "JCmg2zc3SP43jDfGphPsUE7iV3iDQ";
    const GEMINI_KEY = GEMINI_PART_1 + GEMINI_PART_2;

    // Telegram
    const TELEGRAM_PART_1 = "8881345817";
    const TELEGRAM_PART_2 = ":AAHrrmjAw3tzf-yYKXH4R_LpXcSKCjB49g8";
    const TELEGRAM_TOKEN = TELEGRAM_PART_1 + TELEGRAM_PART_2;
    
    const CHAT_ID = '696755650';
    // ------------------------------------------------------------------

    let history = [];
    const chatContainer = document.getElementById('chat-container');
    const chatForm = document.getElementById('chat-form');
    const userInput = document.getElementById('user-input');
    const endChatBtn = document.getElementById('end-chat-btn');
    const finishBanner = document.getElementById('finish-banner');

    function appendMessage(role, text) {
      const wrapper = document.createElement('div');
      wrapper.className = `flex justify-${role === 'user' ? 'end' : 'start'}`;
      const bubble = document.createElement('div');
      bubble.className = `${role === 'user' ? 'user-bubble' : 'ai-bubble'} p-3 rounded-lg max-w-[80%] text-sm shadow`;
      bubble.innerText = text;
      wrapper.appendChild(bubble);
      chatContainer.appendChild(wrapper);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = userInput.value.trim();
      if (!text) return;

      appendMessage('user', text);
      history.push({ role: 'user', parts: [{ text }] });
      userInput.value = '';

      const systemInstruction = `Tu es Alex, le secrétaire virtuel personnel de Monsieur Tisserand. 
Ton rôle est d'accueillir chaleureusement les personnes qui cherchent à le joindre, de qualifier la nature de leur demande. 
Reste toujours très poli, professionnel, courtois et synthétique. Ne prends aucun engagement ferme au nom de M. Tisserand.`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: systemInstruction }] },
            contents: history
          })
        });

        const data = await response.json();
        
        if (data.error) {
          console.error(data.error);
          appendMessage('model', `Désolé, erreur de l'API : ${data.error.message}`);
          return;
        }

        if (data.candidates && data.candidates[0].content.parts[0].text) {
          const reply = data.candidates[0].content.parts[0].text;
          appendMessage('model', reply);
          history.push({ role: 'model', parts: [{ text: reply }] });
        }
      } catch (err) {
        appendMessage('model', "Erreur de connexion au serveur.");
      }
    });

    endChatBtn.addEventListener('click', async () => {
      if (history.length === 0) {
        alert("Aucune conversation à résumer.");
        return;
      }

      endChatBtn.disabled = true;
      endChatBtn.innerText = "Envoi en cours...";

      try {
        const summaryPrompt = [
          ...history,
          { role: 'user', parts: [{ text: "Rédige une fiche de résumé claire et synthétique de cette discussion destinée à M. Tisserand sous ce format :\n- Nom/Identité de l'interlocuteur :\n- Objet de la demande :\n- Degré d'urgence :\n- Action requise / Coordonnées :" }] }
        ];

        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: summaryPrompt })
        });

        const data = await res.json();
        
        if (data.error) {
          alert("Erreur lors de la génération du résumé : " + data.error.message);
          endChatBtn.disabled = false;
          endChatBtn.innerText = "Terminer la conversation";
          return;
        }

        const summaryText = data.candidates[0].content.parts[0].text;

        const telegramRes = await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: CHAT_ID,
            text: `📋 *Nouveau message de la secrétaire Alex*\n\n${summaryText}`,
            parse_mode: 'Markdown'
          })
        });

        if (telegramRes.ok) {
          finishBanner.classList.remove('hidden');
          endChatBtn.innerText = "Conversation terminée";
        } else {
          alert("Le résumé a été créé, mais l'envoi sur Telegram a échoué.");
          endChatBtn.disabled = false;
          endChatBtn.innerText = "Terminer la conversation";
        }
      } catch (err) {
        alert("Erreur générale lors de la procédure de fin de chat.");
        endChatBtn.disabled = false;
        endChatBtn.innerText = "Terminer la conversation";
      }
    });
  </script>
</body>
</html>
